<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Données Locale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Ma Base de Données</h1>

        <div class="search-bar">
            <input type="text" id="search" placeholder="Rechercher..." class="search-input">
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Âge</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="data-container"></tbody>
            </table>
        </div>

        <div class="form-container">
            <div id="errors" class="error-container"></div>
            <form id="data-form">
                <div class="form-group">
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="age">Âge:</label>
                    <input type="number" id="age" name="age" required>
                </div>
                <button type="submit" class="button button--primary">Ajouter</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
