<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base de Données Locale</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Base de Données Locale</h1>
        
        <div class="section">
            <h2>Tables</h2>
            <form id="table-form">
                <input type="text" id="table-name" placeholder="Nom de la table" required>
                <button type="submit" class="button">Créer une table</button>
            </form>
        </div>

        <div class="section">
            <h2>Champs</h2>
            <select id="table-select" class="select">
                <option value="">Sélectionner une table</option>
            </select>

            <form id="field-form">
                <input type="text" id="field-name" placeholder="Nom du champ" required>
                <select id="field-type" class="select">
                    <option value="text">Texte</option>
                    <option value="number">Nombre</option>
                    <option value="date">Date</option>
                    <option value="email">Email</option>
                </select>
                <button type="submit" class="button">Ajouter un champ</button>
            </form>
        </div>

        <div class="section">
            <h2>Données</h2>
            <input type="text" id="search" placeholder="Rechercher..." class="search-input">
            
            <div class="table-container">
                <table>
                    <tbody id="data-container"></tbody>
                </table>
            </div>

            <form id="data-form" class="data-form"></form>
        </div>
    </div>

    <script src="js/Schema.js"></script>
    <script src="js/Database.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
